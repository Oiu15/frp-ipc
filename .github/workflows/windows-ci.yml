name: Windows Engineering Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Version check
        run: python tools/check_version.py

      - name: Ruff
        run: python -m ruff check .

      - name: Pyright
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: "false"
        run: python -m pyright

      - name: Pytest collect
        run: python -m pytest --collect-only -q

      - name: Compile Python sources
        run: python -m compileall _version.py app.py application config core domain drivers events frp_workflow machine modes repositories services ui utils

      - name: Focused regression tests
        run: >
          python -m pytest
          tests/test_history_result_export_service.py
          tests/test_main_screen_history_export.py
          tests/test_app_host_key_dispatch.py
          tests/test_ui_events.py
          tests/test_ui_event_dispatcher.py
          tests/test_ui_queue_adapters.py
          tests/test_typed_ui_event_routing.py
          tests/test_app_device_gateway.py
          tests/test_production_workflow_smoke.py
          tests/test_validation_workflow.py
          tests/test_calibration_domain.py
          tests/test_calibration_repository.py
          tests/test_calibration_repository_compat.py
          tests/test_calibration_repository_roundtrip_compat.py
          tests/test_calibration_service.py

      - name: Full test suite
        run: python -m pytest -q

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: quality
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build PyInstaller smoke artifact
        run: python -m PyInstaller --noconfirm frp-ipc.spec

      - name: Check executable exists
        run: |
          if (-not (Test-Path "dist/FRP-IPC/FRP-IPC.exe")) {
            throw "Missing dist/FRP-IPC/FRP-IPC.exe"
          }

      - name: Package tagged artifact
        if: startsWith(github.ref, 'refs/tags/')
        id: package
        shell: pwsh
        run: |
          $versionTag = python -c "from _version import VERSION_TAG; print(VERSION_TAG)"
          $version = python -c "from _version import VERSION; print(VERSION)"
          $archive = "FRP-IPC-$versionTag-win64.zip"
          if (Test-Path $archive) {
            Remove-Item $archive
          }
          Compress-Archive -Path "dist/FRP-IPC" -DestinationPath $archive
          $isPrerelease = if ($version -match "(alpha|beta|rc)") { "true" } else { "false" }
          "artifact=$archive" >> $env:GITHUB_OUTPUT
          "version_tag=$versionTag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Upload tagged artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.package.outputs.version_tag }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.package.outputs.is_prerelease == 'true' }}
          files: ${{ steps.package.outputs.artifact }}
          generate_release_notes: true
